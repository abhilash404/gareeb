<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gareeb</title>
    <link rel="preload" href="ui/logo.png" as="image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #1b1b1f; overflow: hidden; }
      #status {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        padding: 8px 14px; border-radius: 6px;
        background: rgba(0, 0, 0, 0.7); color: #f4f1ff;
        font: 14px system-ui, sans-serif;
      }
      #status[hidden] { display: none; }
      #ping, #coords {
        position: fixed; top: 8px;
        font: 12px ui-monospace, monospace; text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #ping { right: 10px; }
      #coords { left: 10px; color: #f4f1ff; white-space: pre; }
      #hotbar {
        position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; padding: 6px;
        background: rgba(0, 0, 0, 0.55); border-radius: 8px;
        user-select: none;
      }
      #hotbar:empty { display: none; }
      #hotbar .slot {
        position: relative; width: 72px; height: 72px;
        display: grid; place-items: center;
        border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 6px;
        cursor: pointer;
      }
      #hotbar .slot.selected { border-color: #f4f1ff; background: rgba(255, 255, 255, 0.12); }
      #hotbar .slot.empty .icon { opacity: 0.3; }
      #hotbar .icon { image-rendering: pixelated; }
      #hotbar .key, #hotbar .count {
        position: absolute; font: 12px ui-monospace, monospace; color: #f4f1ff;
        text-shadow: 0 1px 2px #000;
      }
      #hotbar .key { top: 3px; left: 5px; opacity: 0.6; }
      #hotbar .count { bottom: 3px; right: 5px; font-size: 14px; }
      #toasts {
        position: fixed; bottom: 104px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 4px;
        pointer-events: none;
      }
      .toast {
        font: 14px system-ui, sans-serif; color: #f4f1ff; text-shadow: 0 1px 3px #000;
        animation: toast 1.6s ease-out forwards;
      }
      #signout {
        position: fixed; top: 26px; left: 10px; padding: 2px 6px;
        font: 11px ui-monospace, monospace; color: #f4f1ff; opacity: 0.6;
        background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px;
        cursor: pointer;
      }
      #signout:hover { opacity: 1; }
      #signout[hidden] { display: none; }

      /* Welcome, sign-in and character creation. Pixel style: square corners, hard 3px borders,
         stepped shadows instead of soft ones. */
      #screen {
        --ink: #f4f1ff;
        --panel: #2a2433;
        --panel-dark: #1c1823;
        --edge: #0e0b12;
        --rim: #4b4159;
        --gold: #f2b84b;
        --gold-dark: #b9772a;
        position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
        color: var(--ink); font: 16px 'Pixelify Sans', system-ui, sans-serif;
        overflow-y: auto;
      }
      #screen[hidden] { display: none; }
      /* Hidden until the moving background and the logo are ready, then both fade in together. */
      body > canvas, #screen { transition: opacity 0.35s; }
      body.starting > canvas, body.starting #screen { opacity: 0; }
      /* The moving world shows through on the welcome screen; a vignette keeps the text readable. */
      #screen.welcome { background: radial-gradient(ellipse at center, rgba(14, 11, 18, 0.15) 30%, rgba(14, 11, 18, 0.75) 100%); }
      #screen.creating { background: rgba(14, 11, 18, 0.7); }
      #screen .welcome-box {
        display: flex; flex-direction: column; align-items: center; gap: 14px;
        width: min(420px, 100%);
      }
      #screen .logo {
        width: min(639px, 92vw); /* 3x the art */
        image-rendering: pixelated;
        filter: drop-shadow(0 6px 0 rgba(14, 11, 18, 0.55));
        animation: bob 3.2s steps(4) infinite;
      }
      #screen .tagline {
        margin: -4px 0 6px; font-size: 18px; text-align: center;
        text-shadow: 2px 2px 0 var(--edge);
      }
      #screen footer { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 14px; }
      #screen footer a { color: var(--ink); opacity: 0.7; text-shadow: 2px 2px 0 var(--edge); }
      #screen footer a:hover { opacity: 1; }

      #screen .panel {
        width: 100%; padding: 20px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
        background: var(--panel);
        border: 3px solid var(--edge);
        box-shadow: inset 0 0 0 3px var(--rim), 0 6px 0 rgba(14, 11, 18, 0.6);
      }
      #screen .panel.wide { width: min(660px, 100%); }
      #screen h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; text-shadow: 2px 2px 0 var(--edge); }
      #screen label { font-size: 14px; opacity: 0.8; margin-top: 6px; }
      #screen .hint { margin: 0; font-size: 13px; opacity: 0.7; }
      #screen .center { text-align: center; }
      #screen .error { margin: 0; min-height: 1.2em; color: #ff8a8a; font-size: 14px; }
      #screen input {
        padding: 9px 10px; font: inherit; color: inherit;
        background: var(--panel-dark); border: 3px solid var(--edge); border-radius: 0;
        box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.35);
      }
      #screen input:focus { outline: none; border-color: var(--gold); }
      #screen button {
        position: relative; padding: 9px 14px; font: inherit; color: inherit; cursor: pointer;
        background: #3a3247; border: 3px solid var(--edge); border-radius: 0;
        box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.3), inset 0 3px 0 rgba(255, 255, 255, 0.12);
      }
      #screen button:hover { background: #463c55; }
      #screen button:active { top: 2px; box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.3); }
      #screen button.primary {
        background: var(--gold); color: #2a1a08; font-weight: 600; font-size: 18px;
        box-shadow: inset 0 -5px 0 var(--gold-dark), inset 0 3px 0 rgba(255, 255, 255, 0.35);
      }
      #screen button.primary:hover { background: #f7c865; }
      #screen button.primary:active { box-shadow: inset 0 3px 0 var(--gold-dark); }
      #screen button.google { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 14px; }
      #screen .gicon { display: grid; place-items: center; width: 28px; height: 28px; background: #fff; border: 2px solid var(--edge); }
      #screen button:disabled { opacity: 0.5; cursor: default; top: 0; }
      #screen .row { display: flex; gap: 8px; }
      #screen .row input { flex: 1; min-width: 0; }
      #screen .choices { display: flex; flex-wrap: wrap; gap: 6px; }
      #screen .choices button.picked { background: var(--gold); color: #2a1a08; box-shadow: inset 0 -4px 0 var(--gold-dark); }
      #screen .creator { display: flex; gap: 20px; flex-wrap: wrap; }
      #screen .stage {
        flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px;
        padding: 12px; background: var(--panel-dark); border: 3px solid var(--edge);
      }
      #screen .preview { width: 160px; height: 160px; image-rendering: pixelated; }
      #screen .options { flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @media (prefers-reduced-motion: reduce) { #screen .logo { animation: none; } }
      @keyframes toast {
        from { opacity: 0; transform: translateY(6px); }
        15% { opacity: 1; transform: none; }
        75% { opacity: 1; }
        to { opacity: 0; transform: translateY(-8px); }
      }
    </style>
  </head>
  <body class="starting">
    <div id="status" hidden></div>
    <div id="ping"></div>
    <div id="coords"></div>
    <div id="toasts"></div>
    <div id="hotbar"></div>
    <button id="signout" hidden>Sign out</button>
    <div id="screen" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
